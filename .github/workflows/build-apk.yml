name: Full APK Release & Smart Fallback Worker

on:
  push:
    branches: [ "main", "master", "termux-worker-build" ]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Target Build (apk / aab / both)'
        required: false
        default: 'apk'

permissions:
  contents: write

jobs:
  # ==========================================
  # WORKER 1: Primary Fast Build + Auto-Sign
  # ==========================================
  primary-worker:
    name: Worker 1 - Primary Release Build
    runs-on: ubuntu-latest
    outputs:
      apk_built: ${{ steps.compile.outputs.apk_built }}

    steps:
      - name: Checkout Kode Proyek
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK (Otomatis jika proyek Flutter)
        if: hashFiles('pubspec.yaml') != ''
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Bersihkan Path Lokal & Siapkan Keystore Otomatis
        run: |
          rm -f local.properties android/local.properties

          # Buat keystore sementara jika proyek membutuhkan signing release
          if [ ! -f "android/key.properties" ] && [ -d "android" ]; then
            keytool -genkey -v -keystore android/app/auto-release.jks \
              -storepass android123 -alias releasekey -keypass android123 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=GitHubWorker, OU=Build, O=Android, L=ID, S=ID, C=ID"

            cat << EOF > android/key.properties
          storePassword=android123
          keyPassword=android123
          keyAlias=releasekey
          storeFile=auto-release.jks
          EOF
          fi

      - name: Compile APK / AAB Release
        id: compile
        run: |
          TARGET="${{ github.event.inputs.build_target || 'apk' }}"
          mkdir -p release_out

          if [ -f "pubspec.yaml" ]; then
            echo ">>> Mode: Flutter Project"
            [ ! -d "android" ] && flutter create . --platforms=android
            flutter pub get
            flutter build apk --release
            [ "$TARGET" = "aab" ] || [ "$TARGET" = "both" ] && flutter build appbundle --release || true
            APK_PATH=$(find build/app/outputs -name "*.apk" | head -n 1)
          else
            echo ">>> Mode: Native Android / Gradle Project"
            if [ -f "gradlew" ]; then
              chmod +x gradlew
              ./gradlew assembleRelease
            else
              gradle assembleRelease
            fi
            APK_PATH=$(find . -path "*/outputs/apk/*" -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "apk_built=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Pastikan APK sudah ter-sign agar bisa langsung diinstal di Android
          if [[ "$APK_PATH" == *"unsigned"* ]]; then
            BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 | sort -V | tail -n 1)
            "$BUILD_TOOLS/apksigner" sign --ks android/app/auto-release.jks \
              --ks-pass pass:android123 --key-pass pass:android123 \
              --out release_out/app-worker-release.apk "$APK_PATH"
          else
            cp "$APK_PATH" release_out/app-worker-release.apk
          fi

          echo "apk_built=true" >> $GITHUB_OUTPUT

      - name: Upload Artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: built-release-apk
          path: release_out/app-worker-release.apk

  # ==========================================
  # WORKER 2: Fallback Deep-Clean & Safe Mode
  # ==========================================
  fallback-worker:
    name: Worker 2 - Fallback Recovery Build
    needs: primary-worker
    if: failure()
    runs-on: ubuntu-latest
    outputs:
      apk_built: ${{ steps.fallback_compile.outputs.apk_built }}

    steps:
      - name: Checkout Kode Proyek
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17 - Fresh Tanpa Cache)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        if: hashFiles('pubspec.yaml') != ''
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Deep Clean & Build Tanpa R8/Shrinker
        id: fallback_compile
        run: |
          set -o pipefail
          rm -f local.properties android/local.properties
          mkdir -p release_out

          if [ -f "pubspec.yaml" ]; then
            flutter clean
            [ ! -d "android" ] && flutter create . --platforms=android
            flutter pub get
            flutter build apk --release --no-shrink 2>&1 | tee build_error.log
            APK_PATH=$(find build/app/outputs -name "*.apk" | head -n 1)
          else
            if [ -f "gradlew" ]; then
              chmod +x gradlew
              ./gradlew clean assembleRelease --stacktrace 2>&1 | tee build_error.log
            else
              gradle clean assembleRelease --stacktrace 2>&1 | tee build_error.log
            fi
            APK_PATH=$(find . -path "*/outputs/apk/*" -name "*.apk" | head -n 1)
          fi

          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" release_out/app-worker-release.apk
            echo "apk_built=true" >> $GITHUB_OUTPUT
          else
            echo "apk_built=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Upload Artifact APK (Jika Pulih)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: built-release-apk
          path: release_out/app-worker-release.apk

      - name: Upload Log Diagnosa Error (Jika Tetap Gagal)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostic-log
          path: build_error.log

  # ==========================================
  # WORKER 3: Publikasi Link Download Langsung
  # ==========================================
  publish-release:
    name: Worker 3 - Publish Direct Download Link
    needs: [primary-worker, fallback-worker]
    if: always() && (needs.primary-worker.result == 'success' || needs.fallback-worker.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Download Built APK
        uses: actions/download-artifact@v4
        with:
          name: built-release-apk
          path: final_apk

      - name: Buat GitHub Release Otomatis
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Release Build #${{ github.run_number }}
          body: "APK otomatis berhasil dibangun oleh GitHub Worker."
          files: final_apk/app-worker-release.apk
